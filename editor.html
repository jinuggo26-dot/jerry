<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>킬로그 외부 배경 제거</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#090f1d;color:#eef4ff;font:14px system-ui,-apple-system,"Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:4;background:#16243e;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #415875}header strong{font-size:16px;flex:1}button{border:1px solid #456084;background:#263b59;color:white;border-radius:10px;min-height:41px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer}button.primary{background:#6d9aef;border-color:#9ebeff;color:#071128}button:disabled{opacity:.4}button.active{background:#7d9bed;color:#06132f}main{padding:12px;max-width:1300px;margin:auto}.settings{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}.settings span{font-size:13px;color:#bad2ef}.settings input[type=range]{accent-color:#89aefc;width:95px}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:850px){.board{grid-template-columns:minmax(0,1fr)}}.panel{padding:11px;border:1px solid #334c70;background:#152139;border-radius:14px;min-width:0}.panel h2{margin:0 0 9px;font-size:14px}.canvas-frame{position:relative;width:100%;background:#050a12;touch-action:none;overflow:hidden;user-select:none;border-radius:8px}canvas{width:100%;height:auto;display:block;touch-action:none}#paint{position:absolute;inset:0;cursor:crosshair}#preview{background:repeating-conic-gradient(#34405a 0% 25%,#1c273c 0% 50%) 50%/20px 20px}#status{padding:9px 11px;border-radius:9px;background:#1b2f4c;margin-bottom:10px;line-height:1.45}#file{max-width:270px}label{white-space:nowrap}.hint{font-size:12px;color:#9fb5d3;line-height:1.5;margin:8px 0 0}
</style></head>
<body><header><strong>킬로그 외부 정밀 보정</strong><button id="to-parent" hidden>결과를 편집기에 적용</button><button id="save" disabled>PNG 저장</button></header>
<main>
<div id="status" role="status" aria-live="polite">원본 사진을 선택하거나 대필 편집기의 ‘외부 GrabCut 보정’ 버튼으로 열어 주세요.</div>
<div class="settings">
<label>파일 <input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label>
<button id="box" class="active">킬로그 범위</button><button id="keep">살리기</button><button id="erase">지우기</button><button id="undo">마지막 취소</button><button id="clear">표시 초기화</button>
<label>브러시 크기 <input id="size" type="range" min="2" max="34" value="9"><span id="sizev">9px</span></label>
<button class="primary" id="process">배경 제거 실행</button>
</div>
<div class="board">
<section class="panel"><h2>원본 · 영역은 파란 박스, 살리기는 초록, 지우기는 빨간색</h2><div class="canvas-frame"><canvas id="source" width="760" height="300"></canvas><canvas id="paint" width="760" height="300"></canvas></div><p class="hint">마우스 또는 손가락으로 표시해. 킬로그의 오른쪽 꼬리까지 파란 범위 안에 포함해야 해. 살리기·지우기로 지정한 부분은 자동 판정보다 우선해.</p></section>
<section class="panel"><h2>분리 결과 · 760×190 투명 PNG</h2><canvas id="preview" width="760" height="190"></canvas><p class="hint">배경과 색이 비슷한 장식은 한 번에 완벽하게 분리되기 어렵기 때문에, 필요한 곳을 살리기로 표시한 후 다시 실행하면 돼.</p></section>
</div>
</main>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id),src=el('source'),over=el('paint'),prev=el('preview');
const sc=src.getContext('2d'),oc=over.getContext('2d'),pc=prev.getContext('2d');
let origin=null,mode='box',imageReady=false,imgBlob=null,marks=[],box=null,stroke=null,currentPreview=null;
const parentOrigin=new URLSearchParams(location.search).get('parent');
let allowedParent=null;
try{if(parentOrigin){let u=new URL(parentOrigin);if(['https:','http:'].includes(u.protocol))allowedParent=u.origin;}}catch{}
const say=t=>el('status').textContent=t;
function modeSet(next){mode=next;for(const k of ['box','keep','erase'])el(k).classList.toggle('active',(k==='box'?'box':k==='keep'?'fg':'bg')===mode);}
function render(){oc.clearRect(0,0,over.width,over.height);if(box){oc.fillStyle='rgba(75,140,255,.08)';oc.fillRect(box.x,box.y,box.w,box.h);oc.strokeStyle='#7fb6ff';oc.lineWidth=2;oc.strokeRect(box.x+.5,box.y+.5,box.w-1,box.h-1);}
for(const s of marks){oc.strokeStyle=s.type==='fg'?'#45e59e':'#ff6682';oc.lineWidth=s.r*2;oc.lineCap='round';oc.lineJoin='round';oc.beginPath();s.points.forEach((p,i)=>i===0?oc.moveTo(p[0],p[1]):oc.lineTo(p[0],p[1]));if(s.points.length===1){oc.lineTo(s.points[0][0]+.01,s.points[0][1]);}oc.stroke();}
}
function setPicture(file,initial){imgBlob=file;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const w=im.naturalWidth,h=im.naturalHeight;src.width=over.width=w;src.height=over.height=h;sc.drawImage(im,0,0);URL.revokeObjectURL(url);box=initial||{x:Math.round(w*.20),y:Math.round(h*.34),w:Math.round(w*.60),h:Math.round(h*.28)};box.x=Math.max(0,Math.min(w-2,box.x));box.y=Math.max(0,Math.min(h-2,box.y));box.w=Math.min(w-box.x,Math.max(2,box.w));box.h=Math.min(h-box.y,Math.max(2,box.h));marks=[];imageReady=true;prev.width=760;prev.height=190;pc.clearRect(0,0,760,190);currentPreview=null;el('save').disabled=true;el('to-parent').disabled=true;render();say('원본을 불러왔어. 범위에 오른쪽 장식까지 포함한 뒤 배경 제거 실행을 눌러.');};im.onerror=()=>say('원본 이미지를 열 수 없습니다.');im.src=url;}
function pt(e){const r=over.getBoundingClientRect();return [Math.max(0,Math.min(over.width-1,(e.clientX-r.left)/r.width*over.width)),Math.max(0,Math.min(over.height-1,(e.clientY-r.top)/r.height*over.height))];}
over.addEventListener('pointerdown',e=>{if(!imageReady)return;e.preventDefault();over.setPointerCapture(e.pointerId);const [x,y]=pt(e);stroke={start:[x,y],prev:box};if(mode==='box'){box={x,y,w:1,h:1};}else{stroke.pts=[[x,y]];stroke.type=mode;stroke.r=Number(el('size').value);marks.push({type:mode,r:stroke.r,points:stroke.pts});}render();});
over.addEventListener('pointermove',e=>{if(!stroke)return;e.preventDefault();const [x,y]=pt(e);if(mode==='box'){box={x:Math.min(x,stroke.start[0]),y:Math.min(y,stroke.start[1]),w:Math.max(1,Math.abs(x-stroke.start[0])),h:Math.max(1,Math.abs(y-stroke.start[1]))};}else if(Math.hypot(x-stroke.pts.at(-1)[0],y-stroke.pts.at(-1)[1])>=2){stroke.pts.push([x,y]);}render();});
function finish(){if(!stroke)return;if(mode==='box'&&(box.w<10||box.h<8))box=stroke.prev;stroke=null;render();}over.addEventListener('pointerup',finish);over.addEventListener('pointercancel',finish);
for(const [id,type] of [['box','box'],['keep','fg'],['erase','bg']])el(id).onclick=()=>modeSet(type);
el('size').oninput=()=>el('sizev').textContent=el('size').value+'px';
el('clear').onclick=()=>{marks=[];render();};el('undo').onclick=()=>{marks.pop();render();};
el('file').onchange=e=>{const f=e.target.files?.[0];if(f)setPicture(f);};
function markers(){return marks.flatMap(s=>s.points.map(([x,y])=>({type:s.type,x:Math.round(x),y:Math.round(y),r:s.r})));}
el('process').onclick=async()=>{if(!imageReady||!box){say('사진과 킬로그 범위를 선택해.');return;}const btn=el('process');btn.disabled=true;say('서버에서 배경을 분리하고 있어…');const fd=new FormData();fd.append('file',imgBlob,'source.png');fd.append('rect',JSON.stringify({x:Math.round(box.x),y:Math.round(box.y),w:Math.round(box.w),h:Math.round(box.h)}));fd.append('marks',JSON.stringify(markers()));try{const res=await fetch('/api/grabcut',{method:'POST',body:fd});if(!res.ok){const err=await res.json().catch(()=>null);throw Error(err?.detail||`서버 오류 ${res.status}`);}currentPreview=await res.blob();const u=URL.createObjectURL(currentPreview),im=new Image();im.onload=()=>{pc.clearRect(0,0,760,190);pc.drawImage(im,0,0,760,190);URL.revokeObjectURL(u);};im.src=u;el('save').disabled=false;el('to-parent').disabled=false;say('분리 완료. 미리보기를 확인한 뒤 PNG 저장이나 편집기에 적용을 눌러.');}catch(err){say('오류: '+err.message);}finally{btn.disabled=false;}};
el('save').onclick=()=>{if(!currentPreview)return;const u=URL.createObjectURL(currentPreview);const a=document.createElement('a');a.href=u;a.download='킬로그_정밀보정_760x190.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);};
el('to-parent').onclick=async()=>{if(!currentPreview||!allowedParent||window.parent===window)return;let data=await currentPreview.arrayBuffer();window.parent.postMessage({type:'sna-kill:result',data},allowedParent,[data]);say('원래 대필 편집기로 결과를 전송했어.');};
window.addEventListener('message',e=>{if(!allowedParent||e.origin!==allowedParent||e.source!==window.parent)return;const d=e.data;if(d?.type==='sna-kill:image'&&d.data instanceof ArrayBuffer){setPicture(new Blob([d.data],{type:'image/png'}),d.rect);el('to-parent').hidden=false;}});
if(allowedParent&&window.parent!==window)window.parent.postMessage({type:'sna-kill:ready'},allowedParent);
})();
</script></body></html>
